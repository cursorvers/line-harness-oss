name: Cloudflare Migration Audit

on:
  workflow_dispatch:
    inputs:
      strict_runtime:
        description: 'Fail if runtime/config workers.dev references remain'
        required: false
        default: 'false'
  push:
    branches:
      - main
      - 'codex/**'
    paths:
      - 'apps/web/**'
      - 'apps/worker/**'
      - 'packages/line-sdk/**'
      - 'packages/shared/**'
      - 'packages/db/**'
      - 'packages/sdk/**'
      - 'docs/**'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - 'pnpm-workspace.yaml'
      - 'scripts/audit-workers-dev-references.sh'
      - 'scripts/check_cloudflare_surface.sh'
      - 'scripts/simulate-cloudflare-cutover.sh'
      - 'scripts/prepare-cloudflare-cutover.sh'
      - 'scripts/generate-cloudflare-migration-report.sh'
      - '.github/workflows/cloudflare-migration-audit.yml'
      - '.github/workflows/deploy-worker.yml'
  pull_request:
    paths:
      - 'apps/web/**'
      - 'apps/worker/**'
      - 'packages/line-sdk/**'
      - 'packages/shared/**'
      - 'packages/db/**'
      - 'packages/sdk/**'
      - 'docs/**'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - 'pnpm-workspace.yaml'
      - 'scripts/audit-workers-dev-references.sh'
      - 'scripts/check_cloudflare_surface.sh'
      - 'scripts/simulate-cloudflare-cutover.sh'
      - 'scripts/prepare-cloudflare-cutover.sh'
      - 'scripts/generate-cloudflare-migration-report.sh'
      - '.github/workflows/cloudflare-migration-audit.yml'
      - '.github/workflows/deploy-worker.yml'

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      - name: Audit workers.dev references
        run: bash scripts/audit-workers-dev-references.sh

      - name: Generate migration report
        run: |
          report_path="$(bash scripts/generate-cloudflare-migration-report.sh artifacts/cloudflare-migration)"
          cat "$report_path" >> "$GITHUB_STEP_SUMMARY"

      - name: Simulate custom-route cutover
        run: bash scripts/simulate-cloudflare-cutover.sh https://api.example.com

      - name: Enforce strict runtime audit
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.strict_runtime == 'true' }}
        run: bash scripts/audit-workers-dev-references.sh --strict-runtime

      - name: Upload migration report
        uses: actions/upload-artifact@v4
        with:
          name: cloudflare-migration-report
          path: artifacts/cloudflare-migration/
