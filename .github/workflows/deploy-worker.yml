name: Deploy Worker

# Configure CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID secrets to enable auto-deploy
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'apps/worker/**'
      - 'packages/db/**'
      - 'packages/shared/**'
      - 'packages/line-sdk/**'
      - '.github/workflows/deploy-worker.yml'

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @line-crm/shared --filter @line-crm/line-sdk --filter @line-crm/db build

      - name: Upload worker version
        id: upload
        working-directory: apps/worker
        run: |
          set -euo pipefail
          output=$(pnpm exec wrangler versions upload --message "gha deploy ${GITHUB_SHA}")
          printf '%s\n' "$output"
          version_id=$(printf '%s\n' "$output" | sed -n 's/^Worker Version ID: //p' | tail -n 1)
          if [ -z "$version_id" ]; then
            echo "Failed to parse Worker Version ID from wrangler output" >&2
            exit 1
          fi
          echo "version_id=$version_id" >> "$GITHUB_OUTPUT"

      - name: Deploy uploaded version to production
        working-directory: apps/worker
        run: pnpm exec wrangler versions deploy --version-id "${{ steps.upload.outputs.version_id }}" --yes
